services:
  portainer:
    container_name: portainer
    image: portainer/portainer-ce:lts
    # restart: always
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - 9443:9443
      - 9000:9000
      # - 8000:8000  # Remove if you do not intend to use Edge Agents

volumes:
  portainer_data:
    name: portainer_data
    driver: local
    driver_opts:
      type: none
      o: bind
      # Replace this with the actual path to your HDD folder
      device: /home/homelab/compose/portainer/portainer_data


networks:
  default:
    name: portainer_network
